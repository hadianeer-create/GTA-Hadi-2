; HADI: VICE CITY - engine configuration.
; The playable world is generated at runtime by C++ (AHadiCityGenerator), so the game boots into the
; engine's empty Entry map and HadiGameMode builds Vice City in StartPlay(). No binary map asset needed.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/HadiViceCity.HadiGameMode
GameInstanceClass=/Script/HadiViceCity.HadiGameInstance

[/Script/Engine.Engine]
GameUserSettingsClassName=/Script/HadiViceCity.HadiGameUserSettings
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/HadiViceCity")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/HadiViceCity")

[/Script/Engine.RendererSettings]
; Fully dynamic lighting: Lumen GI + reflections, virtual shadow maps, no baked lighting.
r.AllowStaticLighting=False
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.Bloom=True
r.SkinCache.CompileShaders=True
; Hardware ray tracing support is compiled in; HadiGameUserSettings toggles
; r.Lumen.HardwareRayTracing at runtime (Settings > Ray Tracing).
r.RayTracing=True
r.Lumen.HardwareRayTracing=False
r.VirtualTextures=True
r.CustomDepth=3

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
bEnableEnhancedDeterminism=False
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=4

[/Script/Engine.CollisionProfile]
; Engine default profiles are used (Pawn, Vehicle, BlockAll, NoCollision).

[Core.Log]
LogHadi=Log
